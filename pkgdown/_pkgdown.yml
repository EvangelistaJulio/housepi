url: https://mmmi-pasteur.pages.pasteur.fr/housepi

template:
  bootstrap: 5
  light-switch: true
  theme: breeze-light
  theme-dark: breeze-dark
  math-rendering: katex

destination: public

footer:
  structure:
    left: developed_by
    right: built_with
  components:
    developed_by: "Developed by Francesco Camaglia."

home:
  title: Household Epidemiological Modeling and Analysis
  desc: >
    A library of models and tools for epidemiological modeling and analysis of household epidemiological data.

# References
reference:
- title: "Overview"
  desc: >
    Package overview.
  contents:
    - housepi-package
  
- title: "Core functions"
  desc: >
    Generate the core housepi model and perform inference and simulations.
  contents:
    - new_housepi_model
    - HousepiModel
    - evaluate_log_lik
    - run_inference
    - run_simulation

- title: "Model definitions"
  desc: >
    Decorators used to customize model definitions.
  contents:
  - starts_with("add_")
  - starts_with("get_")
  - -ends_with("_draws")

- title: "Inference results"
  desc: >
    Collect and manipulate posterior draws from inference results.
  contents:
  - HousepiPosteriorDraws
  - ends_with("_draws")

- title: "Posterior predictions"
  desc: >
    Perform posterior predictive checks.
  contents:
  - starts_with("measure_")
  - ends_with("_predictive_check")
  - ends_with("PPC")

- title: "Auxiliary tools"
  desc: >
    Miscellaneous functions for general purpose tasks.
  contents:
    - starts_with("summarise_")
    - starts_with("summarize_")
    - -ends_with("_draws")
    - format_credible_interval
    - set_global_cri_level
    - housepi_theme_set

- title: "Browse available definitions"
  desc: >
    Model templates, and internal Rcpp functions, distributions
    and infectivity profiles.
  contents:
  - starts_with("browse_")
  - starts_with("HousepiExposed")

- title: "Datasets"
  desc: >
    Publicly available datasets used for model testing.
  contents:
  - starts_with("flu_")
  - sarscov2_2021_icofs
  - dummy_household

- title: "Under development"
  desc: >
    These functions are currently under development and are still experimental.
  contents:
  - run_power_posteriors
  - HousepiPowerPosteriors
  - evaluate_log_evidence

# Articles 
articles:
  - title: ""
    navbar: ~
    contents:
      - priors_and_proposals
      - group_risks
      - contact_risks
      - data_augmentation
      - infectivity_profiles
      - posterior_predictive_checks
      - user_functions

# Navigation Bar
navbar:
  structure:
    left:
      - intro
      - reference
      - articles
      - templates
    right:
      - search
      - gitlab
      - lightswitch
  components:
    intro:
      text: "Get started"
      href: articles/housepi.html

    templates:
      text: "Templates"
      href: ~
      menu:
        - text: "Test"
          href: reference/template_test.html
        - text: "Final Size"
          href: reference/template_final_size.html
        - text: "Case Ascertained"
          href: reference/template_case_ascertained.html

    gitlab:
      icon: fab fa-gitlab
      href: https://gitlab.pasteur.fr/mmmi-pasteur/housepi
      aria-label: "GitLab repository"
