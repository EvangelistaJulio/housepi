url: https://mmmi-pasteur.pages.pasteur.fr/housepi

template:
  bootstrap: 5  
  light-switch: true  
  theme: breeze-light
  theme-dark: breeze-dark
  math-rendering: katex

destination: public

footer:
  structure:
    left: developed_by
    right: built_with
  components:
    developed_by: "Developed by Francesco Camaglia."

home:
  title: Household Epidemiological Modeling and Analysis
  desc: >
    A library of models and tools for epidemiological modeling and analysis of household epidemiological data.

# References
reference:
- title: "Overview"
  desc: >
    Package overview.
  contents:
    - housepi-package
  
- title: "General"
  desc: >
    General purpose calls to generate a housepi model object and perform analysis. 
  contents:
    - HousepiModel
    - new_housepi_model
    - browse_housepi_templates
    - starts_with("summarise_")
    - starts_with("summarize_")
    - -ends_with("_draws")
    - evaluate_log_lik
    - starts_with("run_")
    - set_global_cri_level
    - housepi_theme_set

- title: "Model definitions"
  desc: >
    Calls used to customize your model definitions.
  contents:
  - starts_with("add_")
  - -ends_with("_list")
  - -ends_with("_template")
  - ends_with("_list")
  - ends_with("_template")
  - starts_with("get_")
  - -ends_with("_draws")
  - starts_with("drop_")

- title: "Inference results"
  desc: >
    Extract draws from inference results.
  contents:
  - HousepiPosteriorDraws
  - ends_with("_draws")
  
- title: "Posterior predictions"
  desc: >
    Calls used to perform posterior predicitive checks.
  contents:
  - starts_with("measure_")
  - starts_with("predicted_")
  - HousepiPrediction
  - PredictedCasesBySize
  - format_credible_interval

- title: "Expose internal functions"
  desc: >
    Expose internal Rcpp functions, distributions and infectivity profiles.
  contents:
  - starts_with("expose_")

- title: "Datasets"
  desc: >
    Public available datasets used for model testing.
  contents:
  - blank_house
  - starts_with("flu_")
  - sarscov2_2021_icofs
  
# Articles 
articles:
  - title: ""
    navbar: ~
    contents:
      - bayesian_mcmc_options
      - data_augmentation
      - infectivity_profiles
      - group_rates
      - contact_rates
      - posterior_predictive_checks
      - user_functions

# Navigation Bar
navbar:
  structure:
    left:
      - intro
      - reference
      - articles
      - hhmodels
    right:
      - search
      - gitlab
      - lightswitch
  components:    
    intro:
      text: "Get started"
      href: articles/housepi.html

    hhmodels:
      text: "Templates"
      href: ~
      menu:
        - text: "Blank"
          href: reference/hhmodel_blank.html
        - text: "Chain Binomial"
          href: reference/hhmodel_chain_binomial.html
        - text: "Augmented Example"
          href: reference/hhmodel_augmented_example.html
        - text: "Augmented Infection Time"
          href: reference/hhmodel_augmented_infection_time.html

    gitlab:
      icon: fab fa-gitlab
      href: https://gitlab.pasteur.fr/mmmi-pasteur/housepi
      aria-label: "GitLab repository"
