url: https://mmmi-pasteur.pages.pasteur.fr/housepi

template:
  bootstrap: 5
  light-switch: true
  theme: breeze-light
  theme-dark: breeze-dark
  math-rendering: katex

destination: public

footer:
  structure:
    left: developed_by
    right: built_with
  components:
    developed_by: "Developed by Francesco Camaglia."

home:
  title: Household Epidemiological Modelling and Analysis
  desc: >
    Statistical analysis and modelling of infectious disease transmission within households.

## References ##
reference:
- title: "Overview"
  desc: >
    Package overview.
  contents:
    - housepi-package
  
- title: "Core functions"
  desc: >
    Generate the core housepi model and perform inference and simulations.
  contents:
    - new_housepi_model
    - HousepiModel
    - evaluate_log_lik
    - starts_with("inspect_")
    - starts_with("run_")

- title: "Model templates"
  desc: >
    Documentation of built-in models.
  contents:
  - template_final_size
  - template_case_ascertained
  - template_test

- title: "Model definitions"
  desc: >
    Decorators used to customize model definitions.
  contents:
  - starts_with("add_")
  - starts_with("get_")
  - -ends_with("_draws")

- title: "Inference results"
  desc: >
    Collect and manipulate posterior draws from inference results.
  contents:
  - HousepiPosteriorDraws
  - ends_with("_draws")

- title: "Predictive checks"
  desc: >
    Perform prior or posterior predictive checks.
  contents:
  - starts_with("measure_")
  - check_predictive
  - ends_with("PredictiveCheck")

- title: "Performance and calibration"
  desc: >
    Simulate surveys at known or prior-drawn parameter values and fit them back.
  contents:
  - check_performance
  - HousepiPerformanceCheck
  - check_calibration
  - HousepiCalibrationCheck
  - combine_checks
  - sample_house_structure

- title: "Auxiliary tools"
  desc: >
    Miscellaneous functions for general purpose tasks.
  contents:
    - starts_with("summari")
    - -ends_with("_draws")
    - format_estimates
    - set_housepi_summary
    - set_housepi_theme

- title: "Browse available definitions"
  desc: >
    Model templates, and internal Rcpp functions, distributions
    and infectivity profiles.
  contents:
  - starts_with("browse_")
  - starts_with("HousepiExposed")

- title: "Datasets"
  desc: >
    Publicly available datasets used for model testing.
  contents:
  - starts_with("flu_")
  - sarscov2_2021_icofs
  - dummy_household

## Articles ##
articles:
  - title: "Articles"
    navbar: ~
    contents:
      - priors_and_proposals
      - group_rates
      - contact_rates
      - data_augmentation
      - infectivity_profiles
      - predictive_checks
      - performance_checks
      - simulation_calibration_checks
      - user_functions
  - title: "Gallery"
    navbar: "Gallery"
    contents:
      - articles/gallery

## Navigation Bar ##
navbar:
  structure:
    left:
      - intro
      - reference
      - articles
      - news
    right:
      - search
      - gitlab
      - lightswitch
  components:
    intro:
      text: "Get started"
      href: articles/housepi.html

    gitlab:
      icon: fab fa-gitlab
      href: https://gitlab.pasteur.fr/mmmi-pasteur/housepi
      aria-label: "GitLab repository"
