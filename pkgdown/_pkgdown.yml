template:
  bootstrap: 5  
  light-switch: true  
  theme: breeze-light
  theme-dark: breeze-dark

destination: docs

url: https://mmmi-pasteur.gitlab.io/housepi

home:
  title: Household Epidemiological Modeling and Analysis
  desc: >
    A library of models and tools for epidemiological modeling and analysis of household epidemiological data.

# References
reference:
- title: "Overview"
  desc: >
    Package overview.
  contents:
    - housepi-package
  
- title: "General"
  desc: >
    General purpose calls to generate a housepi model object and perform analysis. 
  contents:
    - new_housepi_model
    - template_household_model
    - loglikelihood
    - infer
    - simulate
    - simulate.HousepiModel
    - summarise_cases
    - summarise_house_sizes
  sidebar: true

- title: "Model definitions"
  desc: >
    Functions used to customize your model definitions.
  contents:
  - starts_with("add_")
  - starts_with("load_")
  - starts_with("get_")
  - -ends_with("draws")
  - starts_with("drop_")

- title: "Inference results"
  desc: >
    Extract draws from inference results.
  contents:
  - ends_with("draws")
  
- title: "Posterior expectations"
  desc: >
    Posterior expectations.
  contents:
  - starts_with("measure_")
  - starts_with("expec_")

- title: "Test internal functions"
  desc: >
    Calls to internal C++ functions for testing.
  contents:
  - starts_with("test_")

- title: "Datasets"
  desc: >
    Public available datasets used for model testing.
  contents:
  - survey
  - starts_with("flu")
  - sarscov2_2021_israel

- title: "Functions under development"
  desc: >
    Functions in the making. Handle with care!
  contents:
  - evidence  
  - HouseholdSampler
  
# Articles 
articles:
  - title: ""
    navbar: ~
    contents:
      - bayesian_mcmc_options
      - data_augmentation
      - posterior_expected_measures
      - group_rates
      - infectivity_profile_and_custom_functions
      - sample_dataset

# Navigation Bar
navbar:
  structure:
    left:
      - intro
      - reference
      - articles
      - hhmodels
    right:
      - search
      - github
      - lightswitch
  components:    
    intro:
      text: "Get started"
      href: articles/housepi.html
    hhmodels:
      text: "Templates"
      href: ~
      menu:
        - text: "Chain binomial"
          href: reference/_hhmodel_chain_binomial.html
        - text: "Heterogeneous chain binomial"
          href: reference/_hhmodel_chain_binomial_heterogeneous.html
        - text: "Augmented example"
          href: reference/_hhmodel_augm_examples.html
        - text: "Augmented infection times"
          href: reference/_hhmodel_augm_infection_time.html
